name: MsAzure-Ubuntu

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v2

    - name: Deploy to Server
      uses: appleboy/ssh-action@v0.1.6
      with:
        host: ${{ secrets.SERVER_IP }}
        username: ${{ secrets.SERVER_USER }}
        key: ${{ secrets.SSH_KEY }}
        script: |

          sudo docker login -u ${{ secrets.DOCKER_USER }} -p ${{ secrets.DOCKER_PWD }}

          # Pull the latest image from Docker Hub
          sudo docker pull sugoi13/gamerole:latest

          # Stop and remove the existing container if it exists
          sudo docker stop gamerole || true
          sudo docker rm gamerole || true

          # Build the Docker image
          sudo docker build -t sugoi13/gamerole:latest .
          sudo docker run gamerole -d

