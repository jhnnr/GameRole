name: CI/CD Pipeline

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v2

    - name: Deploy to Server
      uses: appleboy/ssh-action@v0.1.6
      with:
        host: ${{ secrets.SERVER_IP }}
        username: ${{ secrets.SERVER_USER }}
        key: ${{ secrets.SSH_KEY }}
        script: |
          cd /home/jhnnr/gamerole
          git pull origin main
          sudo docker build -t gamerole:latest .
          sudo docker stop gamerole || true
          sudo docker rm gamerole || true
          sudo docker run -d --name gamerole -p 80:80 gamerole:latest
