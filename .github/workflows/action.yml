name: Push to Railyway
on: push

jobs:
  push-to-railway:
    runs-on: ubuntu-latest
    steps:
      - name: Github railway deploy
        uses: bervProject/railway-deploy@main
        with:
          railway_token: ${{ secrets.RAILWAY_TOKEN }}
          service: "72bb089b-de40-4d27-80cf-d498feb514c4"