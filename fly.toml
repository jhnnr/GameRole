# fly.toml app configuration file generated for gamerole on 2023-10-22T19:11:22+08:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = "gamerole"
primary_region = "sin"

[build]
  dockerfile = "dockerfile"

[env]
  PORT = "80"

[experimental]
  allowed_public_ports = []
  auto_rollback = true

[[services]]
  internal_port = 80
  protocol = "udp"

  [[services.ports]]
    handlers = ["https"]
    port = 80
    

[[services]]
  internal_port = 80
  protocol = "tcp"

  [[services.ports]]
    handlers = ["https"]
    port = 80
    