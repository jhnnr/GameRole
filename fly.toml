# fly.toml app configuration file generated for gamerole on 2023-10-22T19:11:22+08:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = "gamerole"
primary_region = "sin"

[build]
  dockerfile = "dockerfile"


[experimental]
  allowed_public_ports = [80]
  auto_rollback = true

[[services]]
  http_checks = []
  internal_port = 8043
  processes = ["app"]
  protocol = "tcp"
  script_checks = []

  [services.concurrency]
    hard_limit = 25
    soft_limit = 20
    type = "connections"

  [[services.ports]]
    handlers = ["http"]
    port = 80
    force_https = true

  [[services.ports]]
    handlers = ["tls", "http"]
    port = 443

  [[services.tcp_checks]]
    grace_period = "1s"
    interval = "15s"
    restart_limit = 0
    timeout = "2s"