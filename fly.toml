app = "gamerole"
primary_region = "sin"

[build]
  builder = "paketobuildpacks/builder:base"
  buildpacks = ["gcr.io/paketo-buildpacks/nodejs"]
  
[env]
  PORT = "8080"

[experimental]
  allowed_public_ports = [80]


[[services]]
  http_checks = []
  internal_port = 80
  processes = ["app"]
  protocol = "tcp"
