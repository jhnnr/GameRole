<!DOCTYPE html>
<html>
<head>
  <title>Logs</title>
  <style>
    pre {
      white-space: pre-wrap;
    }
  </style>
</head>
<body>

  <pre id="logOutput"></pre>

  <script src="/socket.io/socket.io.js"></script>
  <script>
    const logOutput = document.getElementById('logOutput');
    const socket = io();

    socket.on('logUpdate', (data) => {
      logOutput.innerHTML += data;
    });

    function checkForLogUpdates() {
      scrollToBottom();
      fetch('/logs')
        .then(response => response.text())
        .then(data => {
          logOutput.innerHTML = data;
          
        })
        .catch(error => console.error('Error fetching log data:', error));
    }

    function scrollToBottom() {
      window.scrollTo(0, 999999999999999999999999);
    }
    
    checkForLogUpdates();
  </script>
</body>
</html>
